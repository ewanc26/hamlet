name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: tag and publish the version atom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test before tagging
        run: dotnet test tests/Hamlet.Sim.Tests.csproj -c Release

      - name: Read the version atom
        id: version
        run: echo "version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)" >> "$GITHUB_OUTPUT"

      - name: Has this version already been tagged?
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish release
        if: steps.check.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: See CHANGELOG.md for v${{ steps.version.outputs.version }}.
          generate_release_notes: true